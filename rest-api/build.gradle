plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common-auth')
    implementation project(':jdbc-auth')
    implementation project(':ldap-auth')
    implementation project(':oauth2-auth')
    implementation project(':common-security')
    implementation project(':authorization-service')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
}

springBoot {
    mainClass = 'com.example.spring.security.reference.api.RestApiApplication'
}
