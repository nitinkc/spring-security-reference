name: spring-security-reference-idp

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: ssr-keycloak
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    environment:
      # Lab-only bootstrap administrator. Never reuse these values outside this
      # isolated local environment.
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: lab-admin-password
      KC_HTTP_PORT: 8081
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "8081:8081"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
